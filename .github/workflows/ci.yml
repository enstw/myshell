name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check
      # Prompt-layer tests. They drive ask/confirm under a real pty, so they
      # cover what the headless round-trips below structurally cannot: those
      # seed every answer so that nothing prompts.
      - run: scripts/test-prompts

  # Both round-trips run in the stock ubuntu:24.04 docker image, which is
  # minimized (no man pages/docs) — the harshest realistic base, and it
  # exercises the unminimize step. scripts/ci-roundtrip seeds the recorded
  # answers so the interactive bootstrap runs headless, then runs it twice
  # (fresh + idempotent re-run) and asserts the results. Only the sudo-user
  # job selects an agent; the others assert that none get installed.
  roundtrip-sudo-user:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap as sudo-capable user in minimized ubuntu:24.04
        run: |
          docker run --rm -v "$PWD":/myshell:ro ubuntu:24.04 bash -ec '
            apt-get update
            apt-get install -y sudo curl git
            useradd -m -s /bin/bash t
            echo "t ALL=(ALL) NOPASSWD:ALL" >>/etc/sudoers
            cp -r /myshell /home/t/myshell && chown -R t:t /home/t/myshell
            # MYSHELL_CI_AGENTS on this job only: it is the one thing that
            # exercises the agent installers, and one agent is enough to cover
            # the shared install_agent path without multiplying the number of
            # third-party installers a red build can be blamed on. Set inline
            # because `su -` resets the environment.
            su - t -c "MYSHELL_CI_AGENTS=claude /home/t/myshell/scripts/ci-roundtrip"
          '

  roundtrip-root:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap as root (no sudo installed) in minimized ubuntu:24.04
        run: |
          docker run --rm -v "$PWD":/myshell:ro ubuntu:24.04 bash -ec '
            apt-get update
            apt-get install -y curl git
            cp -r /myshell /root/myshell
            /root/myshell/scripts/ci-roundtrip
          '

  # macOS leg — runs scripts/ci-roundtrip directly on the runner (no
  # container). A runner is not a bare Mac (brew, node, nvm etc. come
  # preinstalled) — which is the point: the brew and purge paths get real
  # exercise the fresh Ubuntu containers can't give them. A true bare-Mac
  # fresh install remains untested (TODO); the prompt layer is covered by the
  # test-prompts step below.
  roundtrip-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap on a macos-latest runner
        run: scripts/ci-roundtrip
      # After the round-trip, not before: a `run:` step is executed as
      # /bin/bash, which on a macOS runner is 3.2, and test-prompts sources
      # stage 2 (bash 5). It re-execs into a real bash itself, but one has to
      # exist first — bootstrap is what installs it. Run here as well as in
      # `static` because the pty helper branches on the OS, and BSD `script`
      # takes its command differently from util-linux's.
      - run: scripts/test-prompts
